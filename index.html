<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
}

/* capa para asegurar legibilidad */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:0;
}

.content{
position:relative;
z-index:1;
}

header{
padding:20px;
font-size:28px;
font-weight:bold;
}

section{
padding:40px 20px;
}

.foto{
width:700px;
max-width:90%;
border-radius:20px;
margin:10px;
}

a{
color:#fff;
text-decoration:none;
border:1px solid #fff;
padding:10px 20px;
margin:5px;
display:inline-block;
}

.socials{
display:flex;
justify-content:center;
gap:20px;
}

.social{
border:none;
padding:0;
}

.social i{
font-size:40px;
}

iframe{
max-width:90%;
border-radius:20px;
}

</style>
</head>

<body>

<!-- 🎬 VIDEO DE FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<div class="content">

<header class="hero-title">
Nacho & The Cheddar's
</header>

<section>
<h2>Rock Nacional Alternativo</h2>
<p>Canciones propias, también covers</p>
</section>

<section>
<h2>Galería</h2>

<img class="foto" src="Kif28-03-26222.jpg">

</section>

<section>

<h2>Video</h2>

<iframe
width="560"
height="315"
src="https://www.youtube.com/embed/4ffep2h5IcM"
title="YouTube video player"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

</section>

<section>

<h2>Seguinos en las redes</h2>

<div class="socials">

<a class="social"
href="https://instagram.com/nacho.andthecheddars"
target="_blank">

<i class="fa-brands fa-instagram"></i>

</a>

<a class="social"
href="https://youtube.com/@nacho.andthecheddars"
target="_blank">

<i class="fa-brands fa-youtube"></i>

</a>

<a class="social"
href="https://tiktok.com/@nacho.andthecheddars"
target="_blank">

<i class="fa-brands fa-tiktok"></i>

</a>

</div>

</section>

</div>

</body>
</html>
