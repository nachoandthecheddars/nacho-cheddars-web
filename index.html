<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
scroll-behavior:smooth;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
filter:brightness(0.35) blur(2px);
}

body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:0;
}

.content{
position:relative;
z-index:1;
}

/* MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:100;
}

#menu-toggle{ display:none; }

.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
display:inline-block;
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.9);
padding:15px;
border-radius:10px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* HERO */
.hero-title{
padding:20px;
font-size:52px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 20px rgba(0,0,0,0.8);
margin-top:80px;
}

/* botón */
.btn-spotify{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#1DB954;
color:#fff;
border-radius:30px;
text-decoration:none;
font-weight:bold;
}

/* 📸 FOTO SIN RECORTE */
.foto-container{
position:relative;
display:flex;
justify-content:center;
margin-top:40px;
}

.foto{
width:900px;
max-width:95%;
height:auto;          /* 🔥 sin recorte */
border-radius:20px;
display:block;
}

/* overlay redes SOBRE la foto */
.photo-socials{
position:absolute;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
flex-direction:column;
align-items:center;
gap:10px;
}

/* texto arriba */
.photo-socials .title{
font-size:18px;
font-weight:bold;
background:rgba(0,0,0,0.5);
padding:5px 10px;
border-radius:10px;
}

/* iconos */
.photo-socials .icons{
display:flex;
gap:15px;
}

.photo-socials a{
color:#fff;
font-size:28px;
background:rgba(0,0,0,0.5);
padding:8px 10px;
border-radius:10px;
text-decoration:none;
}

/* hover */
.photo-socials i{
transition:0.3s;
}

.photo-socials i:hover{
transform:scale(1.2);
}

</style>
</head>

<body>

<!-- 🎬 VIDEO FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<!-- MENU -->
<div class="menu-container">

<input type="checkbox" id="menu-toggle">
<label for="menu-toggle" class="menu-icon">☰</label>

<nav class="menu">
<a href="#home">Home</a>
<a href="#galeria">Galería</a>
<a href="#canciones">Canciones</a>
</nav>

</div>

<div class="content">

<header class="hero-title">
Nacho & The Cheddar's
</header>

<a class="btn-spotify" href="#canciones">
▶ Escuchar ahora
</a>

<!-- FOTO + REDES SOBRE FOTO -->
<section id="galeria">

<div class="foto-container">

<img class="foto" src="Kif28-03-26222.jpg">

<div class="photo-socials">

<div class="title">Seguinos en las redes</div>

<div class="icons">

<a href="https://instagram.com/nacho.andthecheddars" target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a href="https://youtube.com/@nacho.andthecheddars" target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a href="https://tiktok.com/@nacho.andthecheddars" target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

<a href="https://open.spotify.com/user/316s7lxhhqaij2i5higbs2l7l3sq?si=a428917950d242bf" target="_blank">
<i class="fa-brands fa-spotify"></i>
</a>

</div>

</div>

</div>

</section>

</div>

</body>
</html>
