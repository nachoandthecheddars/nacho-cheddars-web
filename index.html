<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
scroll-behavior:smooth;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
}

/* overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:0;
}

/* contenido */
.content{
position:relative;
z-index:1;
}

/* 🧭 MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:100;
transition:0.3s;
}

/* menú cuando scrollea */
.menu-container.scrolled .menu-icon{
background:rgba(0,0,0,0.85);
}

#menu-toggle{
display:none;
}

/* animación icono */
.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
display:inline-block;
transition:0.3s;
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.9);
padding:15px;
border-radius:10px;
animation:fadeMenu 0.3s ease-in-out;
}

@keyframes fadeMenu{
from{opacity:0; transform:translateY(-10px);}
to{opacity:1; transform:translateY(0);}
}

.menu a{
color:#fff;
text-decoration:none;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.menu a:last-child{
border-bottom:none;
}

#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* HERO */
.hero-title{
padding:20px;
font-size:52px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 20px rgba(0,0,0,0.8);
}

/* botón estilo Spotify */
.btn-spotify{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#1DB954;
color:#fff;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.btn-spotify:hover{
transform:scale(1.05);
}

/* secciones */
section{
padding:60px 20px;
}

/* foto */
.foto{
width:700px;
max-width:90%;
border-radius:20px;
margin:10px;
}

/* redes en blanco */
.socials{
display:flex;
justify-content:center;
gap:20px;
}

.social{
border:none;
padding:0;
color:#fff;
}

.social i{
font-size:40px;
color:#fff;
transition:0.3s;
}

.social i:hover{
transform:scale(1.2);
}

/* iframe */
iframe{
max-width:90%;
border-radius:20px;
}

</style>
