<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="icon" type="image/png" href="Nconsiglas.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial, sans-serif;
background:#000;
color:#fff;
text-align:center;
scroll-behavior:smooth;
overflow-x:hidden;
}

/* 🎬 VIDEO FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-3;
filter:
brightness(0.18)
blur(3px)
contrast(1.15);
}

/* overlay oscuro */
body::before{
content:"";
position:fixed;
inset:0;
background:
linear-gradient(
to bottom,
rgba(0,0,0,0.45),
rgba(0,0,0,0.7)
);
z-index:-2;
}

/* CONTENIDO */
.content{
position:relative;
z-index:2;
}

/* 🧭 MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:999;
}

#menu-toggle{
display:none;
}

.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.55);
padding:10px 15px;
border-radius:12px;
display:inline-block;
backdrop-filter:blur(5px);
border:1px solid rgba(255,255,255,0.1);
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.92);
padding:15px;
border-radius:15px;
min-width:220px;
backdrop-filter:blur(8px);
}

.menu a{
color:#fff;
text-decoration:none;
padding:12px;
font-size:15px;
letter-spacing:1px;
border-bottom:1px solid rgba(255,255,255,0.12);
transition:0.3s;
}

.menu a:hover{
background:rgba(255,255,255,0.08);
}

.menu a:last-child{
border-bottom:none;
}

#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* 🎸 HERO */
.hero-logo{
margin-top:40px;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.hero-logo img{
width:950px;
max-width:94%;
filter:
drop-shadow(0 8px 30px rgba(0,0,0,0.95));
}

/* 🎵 BOTÓN */
.btn-spotify{
display:inline-block;
margin-top:5px;
padding:15px 34px;
background:#d1a129;
color:#fff;
border-radius:50px;
text-decoration:none;
font-weight:bold;
font-size:15px;
letter-spacing:1px;
transition:0.3s;
border:2px solid rgba(255,255,255,0.08);

box-shadow:
0 0 20px rgba(209,161,41,0.25);
}

.btn-spotify:hover{
transform:scale(1.05);

box-shadow:
0 0 30px rgba(209,161,41,0.45);
}

/* 📸 FOTO */
#galeria{
margin-top:40px;
}

.foto{
width:760px;
max-width:92%;
border-radius:26px;

box-shadow:
0 0 35px rgba(0,0,0,0.7);

border:2px solid rgba(255,255,255,0.06);
}

/* 🌐 REDES */
#redes{
margin-top:60px;
padding-bottom:60px;
}

#redes h2{
font-size:30px;
margin-bottom:25px;
letter-spacing:1px;

text-shadow:
0 0 15px rgba(0,0,0,0.9);
}

.socials{
display:flex;
justify-content:center;
align-items:center;
gap:28px;
flex-wrap:wrap;
}

.social{
width:72px;
height:72px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(255,255,255,0.08);

backdrop-filter:blur(6px);

transition:0.3s;
}

.social:hover{
transform:translateY(-4px) scale(1.08);

background:
rgba(255,255,255,0.12);
}

.social i{
font-size:34px;
color:#fff;
}

/* 📱 MOBILE */
@media(max-width:768px){

.hero-logo{
margin-top:80px;
}

.hero-logo img{
width:95%;
}

.btn-spotify{
font-size:14px;
padding:13px 24px;
}

#redes h2{
font-size:24px;
}

.social{
width:62px;
height:62px;
}

.social i{
font-size:28px;
}

.menu{
min-width:190px;
}

}

</style>
</head>

<body>

<!-- 🎬 VIDEO DE FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<!-- 🧭 MENU -->
<div class="menu-container">

<input type="checkbox" id="menu-toggle">

<label for="menu-toggle" class="menu-icon">☰</label>

<nav class="menu">
<a href="#home">Home</a>
<a href="#galeria">Galería</a>
<a href="#canciones">Canciones</a>
<a href="#redes">Redes sociales</a>
</nav>

</div>

<div class="content">

<!-- 🎸 LOGO -->
<header class="hero-logo">
<img src="LogoTitulo.png" alt="Nacho & The Cheddar's">
</header>

<!-- 🎵 BOTÓN -->
<a class="btn-spotify" href="#canciones">
▶ Escuchar ahora
</a>

<!-- 📸 FOTO -->
<section id="galeria">
<img class="foto" src="Kif28-03-26222.jpg">
</section>

<!-- 🌐 REDES -->
<section id="redes">

<h2>La seguimos en redes</h2>

<div class="socials">

<a class="social"
href="https://instagram.com/nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="social"
href="https://youtube.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a class="social"
href="https://tiktok.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

<a class="social"
href="https://open.spotify.com/user/316s7lxhhqaij2i5higbs2l7l3sq?si=a428917950d242bf"
target="_blank">
<i class="fa-brands fa-spotify"></i>
</a>

</div>

</section>

</div>

</body>
</html>
