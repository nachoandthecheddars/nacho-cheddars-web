<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="icon" type="image/png" href="Nconsiglas.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
scroll-behavior:smooth;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
filter:brightness(0.35) blur(2px);
}

/* overlay */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:0;
}

/* contenido */
.content{
position:relative;
z-index:1;
}

/* 🧭 MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:100;
}

#menu-toggle{
display:none;
}

.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
display:inline-block;
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.9);
padding:15px;
border-radius:10px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.menu a:last-child{
border-bottom:none;
}

#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* HERO */
.hero-title{
padding:20px;
font-size:52px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 20px rgba(0,0,0,0.8);
margin-top:80px;
}

/* 🎵 PLAYER */
.spotify-player{
display:inline-flex;
align-items:center;
gap:15px;
background:#1DB954;
color:white;
padding:14px 24px;
border-radius:40px;
font-weight:bold;
cursor:pointer;
margin-top:20px;
box-shadow:0 0 20px rgba(29,185,84,0.4);
transition:0.3s;
user-select:none;
}

.spotify-player:hover{
transform:scale(1.03);
}

.spotify-player button{
background:none;
border:none;
color:white;
font-size:20px;
cursor:pointer;
}

.player-info{
display:flex;
align-items:center;
}

.player-title{
font-size:16px;
font-weight:bold;
}

#audio-player{
display:none;
}

/* foto */
.foto{
width:700px;
max-width:90%;
border-radius:20px;
margin:30px 10px;
}

/* redes */
.socials{
display:flex;
justify-content:center;
gap:20px;
}

.social i{
font-size:40px;
color:#fff;
transition:0.3s;
}

.social i:hover{
transform:scale(1.2);
}

/* iframe */
iframe{
max-width:90%;
border-radius:20px;
}

</style>
</head>

<body>

<!-- 🎬 VIDEO DE FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<!-- 🧭 MENU -->
<div class="menu-container">

<input type="checkbox" id="menu-toggle">

<label for="menu-toggle" class="menu-icon">☰</label>

<nav class="menu">
<a href="#home">Home</a>
<a href="galeria.html">Galería</a>
<a href="#canciones">Canciones</a>
<a href="#redes">Redes sociales</a>
</nav>

</div>

<div class="content">

<header class="hero-title">
Nacho & The Cheddar's
</header>

<!-- 🎵 PLAYER -->
<div class="spotify-player" onclick="toggleAudio()">

<button id="play-btn">▶</button>

<div class="player-info">
<div class="player-title">
"Ni antes, ni después" • <span id="time">0:00</span>
</div>
</div>

</div>

<audio id="audio-player">
<source src="https://raw.githubusercontent.com/nachoandthecheddars/nacho-cheddars-web/main/NI%20ANTES%20NI%20DESPUES%20MP3.mp3" type="audio/mpeg">
</audio>

<section id="galeria">
<img class="foto" src="Kif28-03-26222.jpg">
</section>

<section id="redes">

<h2>La seguimos en redes</h2>

<div class="socials">

<a class="social"
href="https://instagram.com/nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="social"
href="https://youtube.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a class="social"
href="https://tiktok.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

<a class="social"
href="https://open.spotify.com/user/316s7lxhhqaij2i5higbs2l7l3sq?si=a428917950d242bf"
target="_blank">
<i class="fa-brands fa-spotify"></i>
</a>

</div>

</section>

</div>

<script>

const audio = document.getElementById("audio-player");
const time = document.getElementById("time");
const playBtn = document.getElementById("play-btn");

function toggleAudio(){

if(audio.paused){
audio.play();
playBtn.innerText = "❚❚";
}else{
audio.pause();
playBtn.innerText = "▶";
}

}

audio.addEventListener("timeupdate", ()=>{

let minutes = Math.floor(audio.currentTime / 60);
let seconds = Math.floor(audio.currentTime % 60);

if(seconds < 10){
seconds = "0" + seconds;
}

time.innerText = minutes + ":" + seconds;

});

audio.addEventListener("ended", ()=>{

playBtn.innerText = "▶";

});

</script>

</body>
</html>
