<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
scroll-behavior:smooth;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
}

/* overlay oscuro */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.35);
z-index:0;
}

/* contenido */
.content{
position:relative;
z-index:1;
}

/* 🧭 MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:100;
transition:0.3s;
}

#menu-toggle{
display:none;
}

.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
display:inline-block;
transition:0.3s;
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.9);
padding:15px;
border-radius:10px;
animation:fadeMenu 0.3s ease-in-out;
}

@keyframes fadeMenu{
from{opacity:0; transform:translateY(-10px);}
to{opacity:1; transform:translateY(0);}
}

.menu a{
color:#fff;
text-decoration:none;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.menu a:last-child{
border-bottom:none;
}

/* abrir menú */
#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* cambio visual al scrollear */
.menu-container.scrolled .menu-icon{
background:rgba(0,0,0,0.85);
}

/* HERO */
.hero-title{
padding:20px;
font-size:52px;
font-weight:bold;
letter-spacing:2px;
text-shadow:0 0 20px rgba(0,0,0,0.8);
margin-top:80px;
}

/* botón Spotify */
.btn-spotify{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#1DB954;
color:#fff;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.btn-spotify:hover{
transform:scale(1.05);
}

/* secciones */
section{
padding:60px 20px;
}

/* foto */
.foto{
width:700px;
max-width:90%;
border-radius:20px;
margin:10px;
}

/* redes */
.socials{
display:flex;
justify-content:center;
gap:20px;
}

.social{
border:none;
padding:0;
color:#fff;
}

.social i{
font-size:40px;
color:#fff;
transition:0.3s;
}

.social i:hover{
transform:scale(1.2);
}

/* iframe */
iframe{
max-width:90%;
border-radius:20px;
}

</style>
</head>

<body>

<!-- 🎬 VIDEO DE FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<!-- 🧭 MENU -->
<div class="menu-container">

<input type="checkbox" id="menu-toggle">

<label for="menu-toggle" class="menu-icon">
☰
</label>

<nav class="menu">
<a href="#home">Home</a>
<a href="#galeria">Galería</a>
<a href="#canciones">Canciones</a>
<a href="#redes">Redes sociales</a>
</nav>

</div>

<div class="content">

<!-- HOME -->
<div id="home"></div>

<header class="hero-title">
Nacho & The Cheddar's
</header>

<a class="btn-spotify" href="#canciones">
▶ Escuchar ahora
</a>

<!-- FOTO -->
<section id="galeria">
<img class="foto" src="Kif28-03-26222.jpg">
</section>

<!-- CANCIONES -->
<section id="canciones">

<h2>Rock Nacional Alternativo</h2>
<p>Canciones propias, también covers</p>

<br>

<h2>Video</h2>

<iframe
width="560"
height="315"
src="https://www.youtube.com/embed/4ffep2h5IcM"
title="YouTube video player"
frameborder="0"
allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
allowfullscreen>
</iframe>

</section>

<!-- REDES -->
<section id="redes">

<h2>Seguinos en las redes</h2>

<div class="socials">

<a class="social"
href="https://instagram.com/nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="social"
href="https://youtube.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a class="social"
href="https://tiktok.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

</div>

</section>

</div>

<script>
const menu = document.querySelector(".menu-container");

window.addEventListener("scroll", () => {
  if (window.scrollY > 50) {
    menu.classList.add("scrolled");
  } else {
    menu.classList.remove("scrolled");
  }
});

document.querySelectorAll(".menu a").forEach(link => {
  link.addEventListener("click", () => {
    document.getElementById("menu-toggle").checked = false;
  });
});
</script>

</body>
</html>
