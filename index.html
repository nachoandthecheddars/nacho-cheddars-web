<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Nacho & The Cheddar's</title>

<link rel="icon" type="image/png" href="Nconsiglas.png">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<!-- TIPOGRAFÍA -->
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

<style>

body{
font-family:Arial;
background:#000;
color:#fff;
text-align:center;
margin:0;
scroll-behavior:smooth;
}

/* 🎬 VIDEO DE FONDO */
.bg-video{
position:fixed;
top:50%;
left:50%;
width:100vw;
height:100vh;
object-fit:cover;
transform:translate(-50%, -50%);
z-index:-1;
filter:brightness(0.35) blur(2px);
}

/* overlay oscuro */
body::before{
content:"";
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.45);
z-index:0;
}

/* contenido */
.content{
position:relative;
z-index:1;
}

/* 🧭 MENU */
.menu-container{
position:fixed;
top:20px;
left:20px;
z-index:100;
}

#menu-toggle{
display:none;
}

.menu-icon{
font-size:30px;
cursor:pointer;
background:rgba(0,0,0,0.5);
padding:10px 15px;
border-radius:10px;
display:inline-block;
}

.menu{
display:none;
flex-direction:column;
margin-top:10px;
background:rgba(0,0,0,0.9);
padding:15px;
border-radius:10px;
}

.menu a{
color:#fff;
text-decoration:none;
padding:10px;
border-bottom:1px solid rgba(255,255,255,0.2);
}

.menu a:last-child{
border-bottom:none;
}

#menu-toggle:checked + .menu-icon + .menu{
display:flex;
}

/* 🎸 TITULO PRINCIPAL */
.hero-title{
padding:20px;
font-size:72px;
font-family:'Bebas Neue', sans-serif;
letter-spacing:4px;
text-shadow:
0 0 10px rgba(0,0,0,0.9),
0 0 25px rgba(0,0,0,0.7);
margin-top:80px;
color:#fff;
}

/* & EN COOPER BLACK */
.hero-title .amp{
font-family:'Cooper Black', serif;
font-size:82px;
margin:0 10px;
display:inline-block;
transform:translateY(3px);
}

/* botón Spotify */
.btn-spotify{
display:inline-block;
margin-top:20px;
padding:12px 25px;
background:#1DB954;
color:#fff;
border-radius:30px;
text-decoration:none;
font-weight:bold;
transition:0.3s;
}

.btn-spotify:hover{
transform:scale(1.05);
}

/* foto */
.foto{
width:700px;
max-width:90%;
border-radius:20px;
margin:10px;
}

/* redes */
.socials{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:40px;
}

.social i{
font-size:40px;
color:#fff;
transition:0.3s;
}

.social i:hover{
transform:scale(1.2);
}

/* iframe */
iframe{
max-width:90%;
border-radius:20px;
}

/* 📱 RESPONSIVE */
@media(max-width:768px){

.hero-title{
font-size:48px;
letter-spacing:2px;
}

.hero-title .amp{
font-size:58px;
}

.menu-icon{
font-size:26px;
}

.social i{
font-size:34px;
}

}

</style>
</head>

<body>

<!-- 🎬 VIDEO DE FONDO -->
<video autoplay muted loop playsinline class="bg-video">
<source src="Logo para gift.mp4" type="video/mp4">
</video>

<!-- 🧭 MENU -->
<div class="menu-container">

<input type="checkbox" id="menu-toggle">

<label for="menu-toggle" class="menu-icon">☰</label>

<nav class="menu">
<a href="#home">Home</a>
<a href="#galeria">Galería</a>
<a href="#canciones">Canciones</a>
<a href="#redes">Redes sociales</a>
</nav>

</div>

<div class="content">

<!-- 🎸 TITULO -->
<header class="hero-title">
Nacho <span class="amp">&</span> The Cheddar's
</header>

<!-- BOTON -->
<a class="btn-spotify" href="#canciones">
▶ Escuchar ahora
</a>

<!-- FOTO -->
<section id="galeria">
<img class="foto" src="Kif28-03-26222.jpg">
</section>

<!-- REDES -->
<section id="redes">

<h2>La seguimos en redes</h2>

<div class="socials">

<a class="social"
href="https://instagram.com/nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-instagram"></i>
</a>

<a class="social"
href="https://youtube.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-youtube"></i>
</a>

<a class="social"
href="https://tiktok.com/@nacho.andthecheddars"
target="_blank">
<i class="fa-brands fa-tiktok"></i>
</a>

<a class="social"
href="https://open.spotify.com/user/316s7lxhhqaij2i5higbs2l7l3sq?si=a428917950d242bf"
target="_blank">
<i class="fa-brands fa-spotify"></i>
</a>

</div>

</section>

</div>

</body>
</html>
