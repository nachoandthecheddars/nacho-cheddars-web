<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi música</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      padding: 40px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: rgba(255,255,255,0.05);
      padding: 20px;
      border-radius: 12px;
    }

    button {
      padding: 10px;
      margin-top: 10px;
      cursor: pointer;
    }

    input {
      width: 100%;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <!-- AUDIO -->
  <audio id="audio" loop>
    <source src="NI%20ANTES%20NI%20DESPUES%20MP3.mp3" type="audio/mpeg">
  </audio>

  <div class="box">
    <h1>🎧 Mi página</h1>

    <p>Control de música de fondo</p>

    <button onclick="playMusic()">▶ Reproducir música</button>
    <button onclick="toggleMute()">🔊 Silenciar / Activar</button>

    <input type="range" min="0" max="1" step="0.01" value="0.5" id="vol">
  </div>

  <script>
    const audio = document.getElementById("audio");
    const vol = document.getElementById("vol");

    audio.volume = 0.5;

    function playMusic() {
      audio.play();
    }

    function toggleMute() {
      audio.muted = !audio.muted;
    }

    vol.addEventListener("input", (e) => {
      audio.volume = e.target.value;
    });
  </script>

</body>

</html>
